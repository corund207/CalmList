[package]
name = "calmlist"
version = "0.1.0"
description = "A calm, keyboard-first task manager."
authors = ["Jonah Chang"]
license = "MIT"
repository = "https://github.com/corund207/CalmList"
edition = "2021"
rust-version = "1.80"

[lib]
# The staticlib is what iOS links; cdylib and rlib serve the desktop binary.
name = "calmlist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
