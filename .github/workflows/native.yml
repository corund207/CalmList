name: Native apps

# Builds CalmList for Windows, macOS (Apple Silicon + Intel) and iOS with Tauri.
# Run it from the Actions tab, or push a tag like v1.0.0 to attach the installers to a draft release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # The apps come pre-pointed at the hosted Supabase project (the same public values as the web app).
  VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ''
          - os: macos-latest
            name: macos
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional macOS signing and notarization (needs a paid Apple Developer account).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: CalmList ${{ github.ref_name }}
          releaseBody: Installers for Windows and macOS. See the README for first-launch notes.
          releaseDraft: true
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: calmlist-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Generate the Xcode project
        run: npx tauri ios init --ci
      - name: Privacy strings for Ramble's voice input
        run: |
          plist=$(ls src-tauri/gen/apple/*_iOS/Info.plist)
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'CalmList listens only while you use Ramble, to turn what you say into tasks.'" "$plist"
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'CalmList turns what you say in Ramble into text to create tasks.'" "$plist"
      - name: Build the web app
        run: node scripts/build-native.mjs
      # Without an Apple Developer account: an unsigned Simulator build, which proves the app compiles
      # and runs in Xcode's Simulator (drag the .app onto it).
      - name: Build for the iOS Simulator
        if: vars.APPLE_DEVELOPMENT_TEAM == ''
        run: |
          cd src-tauri/gen/apple
          xcodebuild -list
          scheme=$(xcodebuild -list -json | python3 -c 'import json,sys; print([s for s in json.load(sys.stdin)["project"]["schemes"] if s.endswith("_iOS")][0])')
          xcodebuild -scheme "$scheme" -configuration release -sdk iphonesimulator -arch arm64 \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p ../../../ios-out
          cp -R build/Build/Products/*-iphonesimulator/*.app ../../../ios-out/
      # With an Apple Developer account (vars.APPLE_DEVELOPMENT_TEAM and an App Store Connect API key):
      # a signed build for TestFlight / the App Store.
      - name: Signed build for TestFlight
        if: vars.APPLE_DEVELOPMENT_TEAM != ''
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_CONTENT" > ~/private_keys/AuthKey_$APPLE_API_KEY.p8
          export APPLE_API_KEY_PATH=~/private_keys/AuthKey_$APPLE_API_KEY.p8
          npx tauri ios build --export-method app-store-connect
          mkdir -p ios-out && cp src-tauri/gen/apple/build/arm64/*.ipa ios-out/
      - uses: actions/upload-artifact@v4
        with:
          name: calmlist-ios
          path: ios-out
          if-no-files-found: error
